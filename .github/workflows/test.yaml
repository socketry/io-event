name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{matrix.ruby}} on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    continue-on-error: ${{matrix.experimental}}
    
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"
        
        experimental: [false]
        
        include:
          - os: ubuntu-latest
            ruby: truffleruby
            experimental: true
          - os: ubuntu-latest
            ruby: jruby
            experimental: true
          # Use newer packaged liburing for Futex coverage on Ruby head.
          # Switch back to ubuntu-latest after its 26.04 rollout (2026-11-19).
          - os: ubuntu-26.04
            ruby: head
            experimental: true
    
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby}}
        bundler-cache: true
    
    - name: Install packages (Ubuntu)
      if: startsWith(matrix.os, 'ubuntu-')
      run: sudo apt-get update && sudo apt-get install -y liburing-dev
    
    - name: Run tests
      if: matrix.os != 'windows'
      timeout-minutes: 15
      run: bundle exec bake test
    
    - name: Run tests (Windows)
      if: matrix.os == 'windows'
      timeout-minutes: 15
      # Use bash on Windows so the MSYS2/UCRT64 toolchain is on PATH and
      # shared-library linking against ws2_32 resolves correctly.
      shell: bash
      run: bundle exec bake test
